<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아나콘다 프로젝트</title>
<meta property="og:title" content="아나콘다 프로젝트">
<meta property="og:description" content="여기를 눌러 링크를 확인하세요.">
<meta property="og:site_name" content="아나콘다 프로젝트">
<!--
  ===== 배포용 안내 =====
  1) Firebase 콘솔(console.firebase.google.com)에서 프로젝트 생성 후 Firestore 사용 설정
  2) 프로젝트 설정 > 일반 > "내 앱" 에서 웹앱 추가 후 config 값 복사
  3) 아래 <script type="module"> 안의 firebaseConfig 값을 본인 값으로 교체
  4) Firestore 규칙(테스트 단계)은 read,write: true 로 열어두면 친구와 바로 공유 가능
     (운영 단계에서는 보안규칙을 꼭 강화하세요)
-->

<style>
  :root{
    --paper:#FFFFFF;
    --paper2:#C8C9C7;
    --card:#FFFFFF;
    --ink:#2D2926;
    --ink-soft:#53565A;
    --line:#C8C9C7;
    --jh:#53565A;
    --jh-light:#C8C9C7;
    --jh-dark:#3A3C3E;
    --jh2:#2D2926;
    --jh2-light:#E7E6E5;
    --jh2-dark:#2D2926;
    --danger:#9E1B32;
    --danger-light:#F0DCE1;
    --success:#4C6159;
    --success-light:#DCEEDF;
    --warn:#7A7D80;
    --warn-light:#E2E3E4;
    --gray:#53565A;
    --lightgray:#F4F4F3;
    --hatch-a:#DADAD9;
    --hatch-b:#F1F1F0;
    --restgray:#B5B7B7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto;padding:22px 14px 50px;}

  .letterhead{text-align:center;padding:8px 10px 10px;border-bottom:2px solid var(--ink);margin-bottom:14px;position:relative;}
  .letterhead .eyebrow{font-size:10px;letter-spacing:.2em;color:var(--ink-soft);text-transform:uppercase;}
  .letterhead h1{font-family:Georgia,'Noto Serif KR',serif;font-size:20px;font-weight:700;margin:2px 0 4px;}
  .letterhead .period{font-size:12px;color:var(--ink-soft);font-family:'Consolas','SFMono-Regular',monospace;}

  .monthnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px;}
  .monthnav .monthlabel{font-family:Georgia,'Noto Serif KR',serif;font-size:18px;font-weight:700;min-width:110px;text-align:center;}
  .monthnav .navbtn{
    border:1px solid var(--line);background:var(--card);border-radius:8px;
    padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .monthnav .navbtn:disabled{opacity:.3;cursor:default;}
  .monthnav .navbtn:not(:disabled):hover{background:var(--paper2);}
  .section{margin-bottom:36px;}
  .sect-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .badge{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;color:#fff;}
  .badge.jh{background:var(--jh);}
  .badge.jh2{background:var(--jh2);}
  .sect-head .desc{font-size:12.5px;color:var(--ink-soft);}

  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:8px;font-size:11.5px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .legend .sw{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;}

  .tablewrap{overflow-x:auto;border:none;border-radius:10px;background:var(--lightgray);}
  table{border-collapse:collapse;width:100%;min-width:560px;}
  th,td{border:1px solid var(--line);padding:0;text-align:center;}
  thead th{
    background:var(--lightgray);font-size:12px;font-weight:800;color:var(--ink);
    padding:8px 4px;
  }
  thead th.targetcol{width:64px;}
  tbody td.targetcell{background:var(--lightgray);padding:4px;}
  tbody td.targetcell select{
    width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;
    text-align:center;font-size:13px;font-weight:700;padding:6px 2px;color:var(--ink);
    -webkit-appearance:none;appearance:none;cursor:pointer;
  }
  .daycell{
    height:60px;cursor:pointer;user-select:none;position:relative;
    font-size:12px;font-weight:700;color:var(--ink-soft);
  }
  .daycell .num{position:absolute;top:3px;left:5px;font-size:10px;font-weight:400;color:var(--ink-soft);}
  .daycell .mark{font-size:11px;letter-spacing:-.02em;}
  .daycell.padding{background:transparent;border-color:transparent;cursor:default;}
  .daycell.disabled{
    background:repeating-linear-gradient(135deg,var(--hatch-a),var(--hatch-a) 5px,var(--hatch-b) 5px,var(--hatch-b) 10px);
    cursor:default;color:var(--ink-soft);
  }
  .daycell.today{outline:2px solid var(--ink);outline-offset:-2px;}

  .daycell.st-done{background:var(--success-light);color:var(--success);}
  .daycell.st-late{background:var(--warn-light);color:var(--warn);}
  .daycell.st-absent{background:var(--danger-light);color:var(--danger);}
  .daycell.st-rest{background:var(--restgray);color:var(--ink);}
  .daycell.st-upload{background:var(--success-light);color:var(--success);}

  /* Penalty panel */
  .penalty-panel{border:none;border-radius:12px;background:var(--lightgray);padding:16px 16px 18px;margin-top:6px;}
  .penalty-panel h2{margin:0 0 12px;font-family:Georgia,'Noto Serif KR',serif;font-size:18px;color:var(--danger);}
  .statgroup{width:100%;}
  .statgroup-divider{height:1px;background:var(--line);opacity:.6;margin:14px 0;}
  .statgrid{display:flex;flex-wrap:wrap;gap:10px;}
  .statcard{flex:0 0 140px;}
  .statcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .statcard .who{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;display:inline-block;margin-bottom:6px;}
  .statcard .who.jh{background:var(--jh);}
  .statcard .who.jh2{background:var(--jh2);}
  .statcard .label{font-size:12px;color:var(--ink-soft);margin-bottom:2px;}
  .statcard .value{font-family:'Consolas','SFMono-Regular',monospace;font-size:22px;font-weight:700;}
  .statcard .value.danger{color:var(--danger);}
  .total-line{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px dashed var(--danger);margin-top:14px;padding-top:12px;}
  .total-line .label{font-weight:700;font-size:14px;}
  .total-line .value{font-family:'Consolas','SFMono-Regular',monospace;font-size:24px;font-weight:700;color:var(--ink);}
  .total-line .value.danger{color:var(--danger);}

  @media (max-width: 600px){
    .wrap{padding:16px 8px 40px;}
    table{min-width:0;}
    thead th{font-size:9.5px;padding:5px 1px;}
    thead th.targetcol{width:34px;}
    tbody td.targetcell{padding:2px;}
    tbody td.targetcell select{font-size:10px;padding:4px 1px;}
    .daycell{height:44px;font-size:9px;}
    .daycell .num{font-size:8px;top:1px;left:2px;}
    .daycell .mark{font-size:9px;letter-spacing:-.03em;}
    .statgrid{gap:6px;}
    .statcard{flex:0 0 calc(33.333% - 4px);padding:8px 4px;}
    .statcard .label{font-size:10px;}
    .statcard .value{font-size:16px;}
    .statcard .who{font-size:9px;padding:1px 6px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="letterhead">
    <div class="eyebrow">Pledge Contract</div>
    <h1>아나콘다 프로젝트</h1>
    <div class="period">2026.07.21 — 2026.08.31</div>
  </div>

  <div class="monthnav">
    <button id="prevMonthBtn" class="navbtn">◀ 이전달</button>
    <span id="monthLabel" class="monthlabel"></span>
    <button id="nextMonthBtn" class="navbtn">다음달 ▶</button>
  </div>

  <div class="section">
    <div class="sect-head">
      <span class="badge jh">정환</span>
      <span class="desc">매일 오전 9:30 출근 or 운동 · 지각 35,000원 · 결석 70,000원 · 지각 4회마다 올식단</span>
    </div>
    <div class="legend">
      <span class="sw" style="background:var(--success)">✓</span>완료
      <span class="sw" style="background:var(--warn)">지</span>지각
      <span class="sw" style="background:var(--danger)">결</span>결석
      <span class="sw" style="background:var(--gray)">휴</span>휴무
      <span style="margin-left:auto;color:var(--ink-soft);">칸을 클릭하면 상태가 순서대로 바뀌어요 · 맨 왼쪽 칸은 이번주 계획 휴무일수</span>
    </div>
    <div class="tablewrap"><table id="jhTable"></table></div>
  </div>

  <div class="section">
    <div class="sect-head">
      <span class="badge jh2">재현</span>
      <span class="desc">주 4~5개 릴스 업로드 · 부족 1개당 PT 1회 · 절반 미달시 축구금지 · 3회 이상 미달시 조기축구금지+밀린릴스</span>
    </div>
    <div class="legend">
      <span class="sw" style="background:var(--jh2)">업</span>업로드
      <span class="sw" style="background:var(--gray)">휴</span>휴무
      <span style="margin-left:auto;color:var(--ink-soft);">맨 왼쪽 칸은 이번주 목표 업로드 개수(4 or 5)</span>
    </div>
    <div class="tablewrap"><table id="jh2Table"></table></div>
  </div>

  <div class="penalty-panel">
    <h2>제약 발생 현황</h2>
    <div id="penaltyArea"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-89z89yrJb8dDB36_3Sqc51504AywvWk",
  authDomain: "project-1389660754781189097.firebaseapp.com",
  projectId: "project-1389660754781189097",
  storageBucket: "project-1389660754781189097.firebasestorage.app",
  messagingSenderId: "118687485270",
  appId: "1:118687485270:web:1e23476bc64572f4c79af7"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "tracker", "shared-data");

(function(){

const START = new Date(2026,6,21);
const END   = new Date(2026,7,31);
const REAL_TODAY = new Date(); REAL_TODAY.setHours(0,0,0,0);
const EFFECTIVE_TODAY = REAL_TODAY > START ? REAL_TODAY : START;

function fmt(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isBefore(a,b){ return a.getTime()<b.getTime(); }
function sameDay(a,b){ return fmt(a)===fmt(b); }
function inRange(d){ return !isBefore(d,START) && !isBefore(END,d); }
function isPastOrToday(d){ return !isBefore(EFFECTIVE_TODAY, d); }

let data = { jh:{}, jh2:{}, jhTarget:{}, jh2Target:{} };
let saveTimer=null;

let storageOK = true;
async function loadData(){
  try{
    const snap = await getDoc(docRef);
    if(snap.exists()){
      const p = snap.data();
      data.jh = p.jh || {};
      data.jh2 = p.jh2 || {};
      data.jhTarget = p.jhTarget || {};
      data.jh2Target = p.jh2Target || {};
    }
    onSnapshot(docRef, (snap)=>{
      if(!snap.exists()) return;
      const p = snap.data();
      data.jh = p.jh || {};
      data.jh2 = p.jh2 || {};
      data.jhTarget = p.jhTarget || {};
      data.jh2Target = p.jh2Target || {};
      render();
    });
  }catch(e){
    console.warn('load skipped:', e.message);
  }
  try{
    render();
  }catch(e){
    document.getElementById('penaltyArea').innerHTML =
      '<div style="color:var(--danger);font-size:13px;">화면을 그리는 중 오류가 발생했습니다: '+e.message+'</div>';
    console.error('render failed', e);
  }
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await setDoc(docRef, data);
    }
    catch(e){ storageOK=false; console.error('save failed', e); }
  }, 250);
}

function getWeeks(){
  const weeks=[];
  const calStart = new Date(START.getFullYear(), START.getMonth(), 1);
  const calEnd = new Date(END.getFullYear(), END.getMonth()+1, 0);
  const startOffset = (calStart.getDay()+6)%7;
  let wkStart = new Date(calStart); wkStart.setDate(calStart.getDate()-startOffset);
  while(wkStart<=calEnd){
    const wkEnd = new Date(wkStart); wkEnd.setDate(wkStart.getDate()+6);
    const days=[];
    for(let i=0;i<7;i++){
      const d=new Date(wkStart); d.setDate(wkStart.getDate()+i);
      days.push(d);
    }
    weeks.push({start:new Date(wkStart), end:wkEnd, days, key:fmt(wkStart)});
    wkStart.setDate(wkStart.getDate()+7);
  }
  return weeks;
}
const DEFAULT_MONTH_DATE = REAL_TODAY > END ? END : EFFECTIVE_TODAY;
let currentMonth = { year: DEFAULT_MONTH_DATE.getFullYear(), month: DEFAULT_MONTH_DATE.getMonth() };

function monthHasRangeDays(y,m){
  const first = new Date(y,m,1);
  const last = new Date(y,m+1,0);
  return !isBefore(END,first) && !isBefore(last,START);
}
function shiftMonth(delta){
  let y = currentMonth.year, m = currentMonth.month + delta;
  while(m<0){ m+=12; y--; }
  while(m>11){ m-=12; y++; }
  return {year:y, month:m};
}
function updateMonthNav(){
  document.getElementById('monthLabel').textContent = `${currentMonth.year}년 ${currentMonth.month+1}월`;
  const prev = shiftMonth(-1), next = shiftMonth(1);
  document.getElementById('prevMonthBtn').disabled = !monthHasRangeDays(prev.year, prev.month);
  document.getElementById('nextMonthBtn').disabled = !monthHasRangeDays(next.year, next.month);
}
document.getElementById('prevMonthBtn').addEventListener('click', ()=>{
  const p = shiftMonth(-1);
  if(monthHasRangeDays(p.year,p.month)){ currentMonth=p; render(); }
});
document.getElementById('nextMonthBtn').addEventListener('click', ()=>{
  const n = shiftMonth(1);
  if(monthHasRangeDays(n.year,n.month)){ currentMonth=n; render(); }
});

function isActiveDay(d){
  return inRange(d) && d.getMonth()===currentMonth.month && d.getFullYear()===currentMonth.year;
}
function weekInCurrentMonth(wk){
  return wk.days.some(d=>isActiveDay(d));
}
const WEEKS = getWeeks();

const JH_STATES = ['none','done','rest','late','absent'];
const JH_MARK = {none:'', done:'완료', late:'지각', absent:'결석', rest:'휴무'};
const JH_MARK_SHORT = {none:'', done:'완', late:'지', absent:'결', rest:'휴'};
const JH2_STATES = ['none','upload','rest'];
const JH2_MARK = {none:'', upload:'업로드', rest:'휴무'};
const JH2_MARK_SHORT = {none:'', upload:'업', rest:'휴'};
function markFor(person, status){
  const mobile = window.innerWidth <= 600;
  if(person==='jh') return mobile ? JH_MARK_SHORT[status] : JH_MARK[status];
  return mobile ? JH2_MARK_SHORT[status] : JH2_MARK[status];
}

function buildTable(tableId, person){
  const table = document.getElementById(tableId);
  const weekNames=['월','화','수','목','금','토','일'];
  let html = `<thead><tr><th class="targetcol">${person==='jh'?'휴무목표':'업로드목표'}</th>`;
  weekNames.forEach(w=> html+=`<th>${w}</th>`);
  html += `</tr></thead><tbody>`;
  WEEKS.filter(weekInCurrentMonth).forEach(wk=>{
    const targetMap = person==='jh' ? data.jhTarget : data.jh2Target;
    const targetVal = targetMap[wk.key] !== undefined ? targetMap[wk.key] : '';
    const options = [0,1,2,3,4,5,6,7].map(n=>
      `<option value="${n}" ${String(n)===String(targetVal)?'selected':''}>${n}</option>`
    ).join('');
    html += `<tr><td class="targetcell"><select data-week="${wk.key}" data-person="${person}">
      <option value="" ${targetVal===''?'selected':''}>-</option>
      ${options}
    </select></td>`;
    wk.days.forEach(d=>{
      const key = fmt(d);
      const inCurrentMonth = d.getMonth()===currentMonth.month && d.getFullYear()===currentMonth.year;
      const active = inCurrentMonth && inRange(d);
      if(!active){
        const store = person==='jh' ? data.jh : data.jh2;
        const status = inRange(d) ? (store[key] || 'none') : 'none';
        const mark = inRange(d) ? markFor(person, status) : '';
        html += `<td class="daycell disabled"><span class="num">${d.getDate()}</span><span class="mark">${mark}</span></td>`;
        return;
      }
      const store = person==='jh' ? data.jh : data.jh2;
      const status = store[key] || 'none';
      const todayCls = sameDay(d,EFFECTIVE_TODAY) ? ' today' : '';
      const mark = markFor(person, status);
      html += `<td class="daycell st-${status}${todayCls}" data-date="${key}" data-person="${person}">
        <span class="num">${d.getDate()}</span>
        <span class="mark">${mark}</span>
      </td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody>`;
  table.innerHTML = html;

  table.querySelectorAll('.daycell:not(.disabled):not(.padding)').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const key = cell.dataset.date;
      const store = person==='jh' ? data.jh : data.jh2;
      const states = person==='jh' ? JH_STATES : JH2_STATES;
      const cur = store[key] || 'none';
      const idx = states.indexOf(cur);
      const next = states[(idx+1)%states.length];
      if(next==='none') delete store[key]; else store[key]=next;
      queueSave();
      render();
    });
  });
  table.querySelectorAll('.targetcell select').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const wkKey = inp.dataset.week, p = inp.dataset.person;
      const targetMap = p==='jh' ? data.jhTarget : data.jh2Target;
      const v = inp.value.trim();
      if(v==='') delete targetMap[wkKey];
      else targetMap[wkKey] = Math.max(0, Math.min(7, parseInt(v,10)||0));
      queueSave();
      renderPenalty();
    });
  });
}

function computeJH(){
  let lateCount=0, absentCount=0, olsikdanCount=0;
  const dates=[];
  let cur=new Date(START);
  while(cur<=END){ dates.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
  dates.forEach(d=>{
    if(!isPastOrToday(d)) return;
    const key=fmt(d);
    let status = data.jh[key] || 'none';
    if(status==='rest') return;
    if(status==='none') status='absent';
    if(status==='late'){ lateCount++; if(lateCount%4===0) olsikdanCount++; }
    else if(status==='absent'){ absentCount++; }
  });
  return { lateCount, absentCount, lateFine:lateCount*35000, absentFine:absentCount*70000, olsikdanCount };
}

function computeJH2(){
  let ptOwed=0, soccerBanWeeks=0;
  WEEKS.forEach(wk=>{
    const finished = isBefore(wk.end, EFFECTIVE_TODAY);
    if(!finished) return;
    const daysInRange = wk.days.filter(d=>inRange(d));
    if(daysInRange.length===0) return;
    const targetRaw = data.jh2Target[wk.key];
    const target = targetRaw!==undefined && targetRaw!=='' ? Number(targetRaw) : 5;
    let uploaded=0;
    daysInRange.forEach(d=>{
      const st = data.jh2[fmt(d)];
      if(st==='upload') uploaded++;
    });
    const shortfall = Math.max(0, target-uploaded);
    ptOwed += shortfall;
    const halfMissed = uploaded <= Math.floor(target/2);
    const threePlusMissed = shortfall>=3;
    if(halfMissed || threePlusMissed) soccerBanWeeks++;
  });
  return { ptOwed, soccerBanWeeks };
}

function renderPenalty(){
  const jh = computeJH();
  const jh2 = computeJH2();
  const area = document.getElementById('penaltyArea');
  const totalFine = jh.lateFine + jh.absentFine;
  const cls = (n)=> n>0 ? 'value danger' : 'value';
  area.innerHTML = `
    <div class="statgroup group-jh">
      <div class="statgrid">
        <div class="statcard"><span class="who jh">정환</span><div class="label">지각</div><div class="${cls(jh.lateCount)}">${jh.lateCount}회</div></div>
        <div class="statcard"><span class="who jh">정환</span><div class="label">결석</div><div class="${cls(jh.absentCount)}">${jh.absentCount}회</div></div>
        <div class="statcard"><span class="who jh">정환</span><div class="label">올식단</div><div class="${cls(jh.olsikdanCount)}">${jh.olsikdanCount}회</div></div>
      </div>
    </div>
    <div class="statgroup-divider"></div>
    <div class="statgroup group-jh2">
      <div class="statgrid">
        <div class="statcard"><span class="who jh2">재현</span><div class="label">PT 제공</div><div class="${cls(jh2.ptOwed)}">${jh2.ptOwed}회</div></div>
        <div class="statcard"><span class="who jh2">재현</span><div class="label">축구 금지</div><div class="${cls(jh2.soccerBanWeeks)}">${jh2.soccerBanWeeks}주</div></div>
      </div>
    </div>
    <div class="total-line"><span class="label">정환 총 벌금</span><span class="${cls(totalFine)}">${totalFine.toLocaleString()}원</span></div>
    <div class="total-line"><span class="label">재현 총 PT 제공</span><span class="${cls(jh2.ptOwed)}">${jh2.ptOwed}회</span></div>
  `;
}

function render(){
  updateMonthNav();
  buildTable('jhTable','jh');
  buildTable('jh2Table','jh2');
  renderPenalty();
}

let resizeTimer=null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 200);
});

loadData();
})();
</script>
</body>
</html>
